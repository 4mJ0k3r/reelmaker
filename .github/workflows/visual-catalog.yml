name: Visual catalog

on: [push, pull_request]

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runtime.txt pytest==8.4.2
      - run: python -m reelforge.catalog validate
      - run: python -m reelforge.catalog generate --check
      - run: python -m pytest -q tests/test_visual_catalog.py tests/test_stage1a_world_kit.py tests/test_stage1b_farm_motion.py tests/test_encoder_cleanup.py tests/test_stage1c_cold_ridge.py tests/test_stage2a_rowan_performance.py tests/test_stage2b_mellow_performance.py tests/test_stage2c_character_staging.py
      - run: >-
          python -m pytest -q
          tests/test_mvp_prompt_to_reel.py::test_supported_vocabulary
          'tests/test_mvp_prompt_to_reel.py::test_plan_and_manifest_compile[15-5]'
          tests/test_production.py::test_episode_contracts_unchanged
      - run: python -m pytest -q tests/test_stage3a_cinematic_story.py tests/test_stage3a1_editorial_polish.py tests/test_stage3b_farm_story.py tests/test_stage3c_story_templates.py

  contracts:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runtime.txt pytest==8.4.2
      - run: >-
          python -m pytest -q tests/test_cinematic_project.py tests/test_cinematic_transaction.py
          tests/test_sprint_d_motion.py tests/test_sprint_d_staging.py tests/test_sprint_d_camera.py
          tests/test_sprint_d_worlds.py
          tests/test_sprint_d8_direction.py tests/test_sprint_d8_pacing.py
          tests/test_sprint_d8_operator.py tests/test_sprint_d8_trace.py tests/test_sprint_d9_security.py
          tests/test_sprint_e_signal_acting.py
          -k "not caption_outlines and not native_audio_registry"

  native:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config ffmpeg
      - run: python -m pip install -r requirements-runtime.txt -r requirements-renderer.txt pytest==8.4.2
      - run: python run_reel.py --check
      - run: >-
          python -m pytest -q --basetemp outputs/ci-native
          tests/test_cinematic_project.py tests/test_cinematic_transaction.py
          tests/test_encoder_cleanup.py tests/test_sprint_b1.py
          tests/test_sprint_d_motion.py tests/test_sprint_d_staging.py tests/test_sprint_d_camera.py
          tests/test_sprint_d_worlds.py
          tests/test_sprint_d8_direction.py tests/test_sprint_d8_pacing.py
          tests/test_sprint_d8_operator.py tests/test_sprint_d8_trace.py
          tests/test_sprint_d8_native_faults.py tests/test_sprint_d9_security.py
          tests/test_sprint_e_signal_acting.py
