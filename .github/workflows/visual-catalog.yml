name: Visual catalog

on: [push, pull_request]

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runtime.txt pytest==8.4.2
      - run: python -m reelforge.catalog validate
      - run: python -m reelforge.catalog generate --check
      - run: python -m pytest -q tests/test_visual_catalog.py tests/test_stage1a_world_kit.py
      - run: >-
          python -m pytest -q
          tests/test_mvp_prompt_to_reel.py::test_supported_vocabulary
          'tests/test_mvp_prompt_to_reel.py::test_plan_and_manifest_compile[15-5]'
          tests/test_production.py::test_episode_contracts_unchanged
